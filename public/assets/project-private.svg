<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071626"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#22d3ee" stroke-opacity="0.12" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#glow)"/>
  <!-- 打码带：示意内容被脱敏 -->
  <g>
    <rect x="70" y="96" width="180" height="16" rx="8" fill="url(#hatch)"/>
    <rect x="70" y="124" width="120" height="16" rx="8" fill="url(#hatch)"/>
    <rect x="70" y="152" width="220" height="16" rx="8" fill="url(#hatch)"/>
    <rect x="70" y="180" width="90" height="16" rx="8" fill="url(#hatch)"/>
  </g>
  <!-- 封存锁：线条几何 -->
  <g stroke="#22d3ee" fill="none" stroke-width="3" opacity="0.9">
    <rect x="420" y="180" width="120" height="96" rx="14"/>
    <path d="M446 180 v-26 a34 34 0 0 1 68 0 v26"/>
    <circle cx="480" cy="222" r="10"/>
    <line x1="480" y1="232" x2="480" y2="250"/>
  </g>
  <g stroke="#818cf8" fill="none" opacity="0.4">
    <circle cx="480" cy="228" r="86"/>
    <circle cx="480" cy="228" r="118" opacity="0.5"/>
  </g>
  <rect x="60" y="316" width="8" height="34" rx="4" fill="#818cf8"/>
  <text x="86" y="340" font-family="Menlo, monospace" font-size="22" font-weight="700" fill="#9db0c4">CONFIDENTIAL</text>
</svg>
